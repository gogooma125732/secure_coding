name: Security and quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build, test, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: timeout 180s npm ci --fetch-timeout=30000 --fetch-retries=1

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Verify dependency integrity
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 120s npm run security:check; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Dependency audit failed, retrying in 15 seconds (attempt $((attempt + 1))/3)..."
              sleep 15
            fi
          done
          echo "Dependency audit failed after 3 attempts."
          exit 1
        env:
          npm_config_fetch_timeout: 30000
          npm_config_fetch_retries: 1

      - name: Build and test
        run: npm test

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
